# ============================================================================
# pyproject.toml — AndroidAutomation 项目配置
# 内容：打包元数据、依赖声明，以及 ruff / mypy / pytest / coverage 工具配置
# 规范：https://packaging.python.org/en/latest/specifications/pyproject-toml/
#
# 注意：pytest 配置只在本文件声明。仓库内不要再出现 pytest.ini / setup.cfg，
#       否则它们的优先级更高，会让本文件的 [tool.pytest.ini_options] 整体失效。
# ============================================================================

# ----------------------------------------------------------------------------
# 构建系统声明
# 使用 hatchling 作为构建后端（轻量、快速、支持动态版本）
# ----------------------------------------------------------------------------
[build-system]
requires = ["hatchling>=1.27"]      # >=1.27 才支持 license = "SPDX 表达式"
build-backend = "hatchling.build"

# ----------------------------------------------------------------------------
# 项目元数据
# ----------------------------------------------------------------------------
[project]
name = "android-automation"
dynamic = ["version"]                # 版本号唯一来源：core/__init__.py
description = "基于 Appium 的 Android UI 自动化框架（轻量设备封装 + pytest 夹具）"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "cmrhyq", email = "cmrhyq@gmail.com" },
]
keywords = ["android", "testing", "automation", "appium", "pytest"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]

# ----------------------------------------------------------------------------
# 运行时依赖（pip install android-automation 时自动安装）
# 注：除标准库外只有 Appium 客户端一个外部依赖 ——
#     config.py 自己解析 .env（不引入 python-dotenv）、日志用 stdlib logging。
# ----------------------------------------------------------------------------
dependencies = [
    "Appium-Python-Client>=6.0.8,<7",
]

# ----------------------------------------------------------------------------
# 可选依赖分组（pip install -e ".[dev,test]"）
# ----------------------------------------------------------------------------
[project.optional-dependencies]
# 开发工具：lint、类型检查、git hooks
dev = [
    "ruff>=0.4.0",                 # 代码检查 & 格式化
    "mypy>=1.10.0",                # 静态类型检查
    "pre-commit>=3.7.0",           # Git 提交前钩子（需 .pre-commit-config.yaml 才生效）
    "detect-secrets>=1.5",         # 密钥泄漏扫描（需 .secrets.baseline 才生效）
]
# 测试工具
test = [
    "pytest>=9.1.1",               # 测试框架
    "pytest-cov>=5.0.0",           # 覆盖率插件
    "pytest-mock>=3.14.0",         # Mock 增强
    "pytest-xdist>=3.5.0",         # 并行测试
    "pytest-timeout>=2.3.0",       # 测试超时控制
]

# ----------------------------------------------------------------------------
# 项目链接（显示在 PyPI 页面）
# ----------------------------------------------------------------------------
[project.urls]
Homepage = "https://github.com/cmrhyq/AndroidAutomation"
Repository = "https://github.com/cmrhyq/AndroidAutomation"
Issues = "https://github.com/cmrhyq/AndroidAutomation/issues"

# ----------------------------------------------------------------------------
# Hatch：动态版本来源 + 打包目标
# 注：仓库是 flat-layout 且有 androidauto / flows / pages 多个顶层目录，
#     不显式声明 packages 会被自动推断成错误结果（甚至打包失败）。
# ----------------------------------------------------------------------------
[tool.hatch.version]
path = "core/__init__.py"     # 读取其中的 __version__

[tool.hatch.build.targets.wheel]
packages = ["androidauto", "flows", "pages"]

[tool.hatch.build.targets.sdist]
include = [
    "/androidauto",
    "/flows",
    "/pages",
    "/scripts",
    "/tests",
    "/README.md",
    "/LICENSE",
]

# ----------------------------------------------------------------------------
# Ruff 配置（代码检查 & 格式化）
# 文档：https://docs.astral.sh/ruff/configuration/
# ----------------------------------------------------------------------------
[tool.ruff]
target-version = "py310"             # 与 requires-python 保持一致
line-length = 120                    # 最大行长度
extend-exclude = [                   # 运行产物与内置 Appium，不参与检查
    "artifacts",
    "tools",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle 错误
    "F",    # pyflakes
    "W",    # pycodestyle 警告
    "I",    # isort（导入排序）
    "N",    # pep8-naming（命名规范）
    "UP",   # pyupgrade（Python 版本升级建议）
    "B",    # flake8-bugbear（常见 bug 模式）
    "A",    # flake8-builtins（内置名称遮蔽）
    "SIM",  # flake8-simplify（代码简化建议）
]
ignore = [
    "E501",   # 行长度由 formatter 控制，lint 不重复检查
    "B008",   # 封装层在默认参数中调用工厂函数是惯用写法（如 options=ui_automator2_options()）
    "SIM108", # 三元表达式在复杂场景下可读性不如 if-else
]

[tool.ruff.lint.isort]
known-first-party = ["androidauto", "flows", "pages"]  # 项目自身模块，排序归入第一方

# ----------------------------------------------------------------------------
# mypy 配置（静态类型检查）
# 文档：https://mypy.readthedocs.io/en/stable/config_file.html
# ----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
exclude = ["artifacts/", "tools/", "\\.venv/"]

[[tool.mypy.overrides]]
module = ["appium.*", "selenium.*"]  # 第三方库无类型桩
ignore_missing_imports = true

# ----------------------------------------------------------------------------
# Pytest 配置（本文件为唯一来源）
# 文档：https://docs.pytest.org/en/stable/reference/customize.html
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]                # 测试文件搜索路径
pythonpath = ["."]                   # 项目根目录加入 sys.path（需 pytest>=7）
addopts = [
    "-ra",                           # 汇总 skip / xfail 等非常规结果
    "--strict-markers",              # 未注册的 marker 报错
    "--tb=short",                    # 简短的 traceback
]
markers = [
    "device: 需要真实设备/模拟器在线的用例（无设备时由 conftest 自动 skip）",
    "unit: 单元测试（快速，无外部依赖）",
    "integration: 集成测试（可能依赖外部服务）",
    "slow: 耗时较长的测试",
]

# ----------------------------------------------------------------------------
# Coverage 配置（测试覆盖率）
# 文档：https://coverage.readthedocs.io/en/latest/config.html
# ----------------------------------------------------------------------------
[tool.coverage.run]
source = ["androidauto"]             # 只统计框架本体（项目无 src/ 目录）
branch = true                        # 启用分支覆盖率
omit = [
    "tests/*",
    "scripts/*",                     # 手工调试脚本，不计入覆盖率
]

[tool.coverage.report]
show_missing = true                  # 显示未覆盖的行号
skip_empty = true                    # 跳过空文件
fail_under = 30                      # 覆盖率低于此值时报告失败
exclude_lines = [                    # 这些行不计入覆盖率统计
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]
